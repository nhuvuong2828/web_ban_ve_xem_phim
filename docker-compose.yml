version: '3.8'

services:
  # 1. SQL Server Database (Chạy trong Docker nhưng xem được trên máy thật)
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinema_db_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1434:1433" # Mở port 1434 ra máy chủ của bạn để tránh đụng độ với SQL thật
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "SA", "-P", "YourStrongPassword123!", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Backend
  backend:
    build:
      context: ./cinema-backend
      dockerfile: Dockerfile
    container_name: cinema_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://database:1433;databaseName=cinema_db;encrypt=true;trustServerCertificate=true;createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=YourStrongPassword123!
    depends_on:
      database:
        condition: service_healthy

  # 3. React.js Frontend (Mock container chờ code)
  frontend:
    image: node:20-alpine
    container_name: cinema_frontend
    working_dir: /app
    # Khi nào bạn có thư mục cinema-frontend, hãy mở comment các dòng dưới đây
    # volumes:
    #   - ./cinema-frontend:/app
    # command: sh -c "npm install && npm run dev"
    # Giữ cho container sống để test cấu trúc compose
    command: sh -c "echo 'Frontend container is waiting for source code...' && sleep infinity"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  sqlserver_data:
